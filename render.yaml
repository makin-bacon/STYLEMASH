services:
  - type: web
    name: stylemash
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
